name: Payload Size Comparison

permissions:
  actions: none
  checks: none
  contents: read
  deployments: none
  id-token: none
  issues: none
  discussions: none
  packages: none
  pages: none
  pull-requests: write
  repository-projects: none
  security-events: none
  statuses: none

on:
  pull_request:
    branches:
      - master

jobs:
  compare-payload-sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Compare Payload Sizes

    steps:
      - name: Install system dependencies
        run: sudo apt-get install -y --no-install-recommends libpcap-dev graphviz

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history needed to switch between base and head refs
          fetch-depth: 0

      - name: Read Ruby version
        id: ruby-version
        run: echo "version=$(cat .ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '${{ steps.ruby-version.outputs.version }}'
          bundler-cache: true

      - name: Compare payload sizes
        id: compare
        env:
          BUNDLE_WITHOUT: "coverage development pcap"
        run: |
          echo "Comparing payload sizes: ${{ github.event.pull_request.base.sha }} vs ${{ github.event.pull_request.head.sha }}"
          ruby tools/dev/compare_payload_sizes.rb \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}" \
            --format markdown > payload_report.md

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('payload_report.md', 'utf8');

            // Find and update existing comment, or create a new one
            const marker = '## Payload Size Comparison';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-size-report
          path: payload_report.md
